<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Risco e Controle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        /* Suaviza a barra de rolagem */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="p-6 md:p-10">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Matriz de Riscos e Procedimentos</h1>
                <p class="text-slate-500 text-sm mt-1">Visualização limpa e categorizada de prioridades e controles de tráfego.</p>
            </div>
            <div class="hidden sm:flex gap-2 text-xs font-medium text-slate-500">
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-red-100 border border-red-200 block"></span> Crítico (10)</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-orange-100 border border-orange-200 block"></span> Alto (8-9)</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-yellow-100 border border-yellow-200 block"></span> Médio (7)</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-100 border border-emerald-200 block"></span> Baixo (5-6)</span>
            </div>
        </header>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left whitespace-nowrap md:whitespace-normal border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider font-semibold border-b border-slate-200">
                            <th class="py-4 px-6 w-40">Item</th>
                            <th class="py-4 px-6 text-center w-24">Prioridade</th>
                            <th class="py-4 px-4 text-center w-32">C. Tráfego</th>
                            <th class="py-4 px-4 text-center w-32">C. Tráfego PATE</th>
                            <th class="py-4 px-6 min-w-[250px]">Detalhe</th>
                            <th class="py-4 px-6 min-w-[250px]">Risco</th>
                            <th class="py-4 px-6 text-center w-24">Grupo</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm text-slate-700 divide-y divide-slate-100">
                        <!-- Linhas serão renderizadas via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const tableData = [
            { item: "ROF 9.1.2", prio: 10, ct: true, ctp: true, det: "Circulação de dois trens no mesmo bloco", risco: "Colisão de trens", grupo: ["AC", "MTM"] },
            { item: "ROF 9.1.14", prio: 10, ct: true, ctp: true, det: "Emergência em Linha adjascente", risco: "Esbarro de trens", grupo: ["AC", "MTM"] },
            { item: "ROF 9.1.19", prio: 10, ct: true, ctp: true, det: "Transferência para controle local (manobra)", risco: "Avanço de sinal, quebra de chave, colisão de trens", grupo: ["AC", "MTM"] },
            { item: "ROF 9.1.16", prio: 10, ct: true, ctp: true, det: "Circulação em suspeita de fratura de trilho, ocupação momentânia e forte impacto", risco: "Descarrilamento", grupo: ["AC", "MTM"] },
            { item: "ROF 9.6.13.3", prio: 10, ct: true, ctp: true, det: "Painel Isolado", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC", "MTM"] },
            { item: "ROF 5.2.3.3", prio: 10, ct: true, ctp: true, det: "Retorno de mensagem na íntegra", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC", "MTM"] },
            { item: "MOF 10.5.2", prio: 10, ct: true, ctp: true, det: "Operação de AMV em ordem de Avanço", risco: "Quebra de chave, descarrilamento", grupo: ["AC", "MTM"] },
            { item: "MOF 10.5.1", prio: 10, ct: true, ctp: true, det: "Licenciamento em trecho não sinalizado", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC", "MTM"] },
            { item: "MOF 10.4.3", prio: 10, ct: true, ctp: true, det: "Ocupção de rodoferroviário", risco: "Colisão de trens", grupo: ["AC", "MTM"] },
            { item: "MOF 10.6.1", prio: 10, ct: true, ctp: true, det: "Modo totalmente degradado", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC", "MTM"] },
            { item: "POP-GNO-0020 6.3.1", prio: 10, ct: false, ctp: true, det: "Licenciamento no terminal da CSN", risco: "Colisão de trens, quebra de chave", grupo: ["AC", "MTM"] },
            { item: "POP-CCO-0001 6", prio: 10, ct: true, ctp: true, det: "Apontar e Falar", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC", "MTM"] },
            
            { item: "ROF 5.2.3.7", prio: 9, ct: true, ctp: true, det: "Padrão de comunicação", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC"] },
            { item: "MOF 10.6", prio: 9, ct: true, ctp: true, det: "Circulação em modo degradado", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC"] },
            { item: "POP-PCE-0250 6.1", prio: 9, ct: true, ctp: true, det: "Procedimento de Concessão de Intervalos", risco: "Atropelamento, colisão de trens, quebra de chave, descarrilamento", grupo: ["AC"] },
            { item: "POP-PTR-0001 6.2.4", prio: 8, ct: true, ctp: false, det: "Modo manobra em FVR", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC"] },
            { item: "MOF 6.2", prio: 8, ct: true, ctp: true, det: "Circulação de trens em modo Degradado", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC"] },
            { item: "POP-CCO-0234 6.2.6", prio: 8, ct: false, ctp: true, det: "Licenciamento no Terminal Andaime", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
            
            { item: "PG-GNO-0005", prio: 7, ct: true, ctp: true, det: "Pesagem de trens e alívio de carega", risco: "Descarrilamento", grupo: ["AC"] },
            { item: "POP-GNO-0020 6.2.16", prio: 7, ct: false, ctp: true, det: "Concessão de Intervalos no Brisamar", risco: "Atropelamento, colisão de trens, quebra de chave, descarrilamento", grupo: ["AC"] },
            { item: "POP-GNO-0020 6.3.6", prio: 7, ct: false, ctp: true, det: "Licenciamento Gerdau", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
            { item: "POP-PCE 0250 6.4", prio: 7, ct: true, ctp: true, det: "-", risco: "-", grupo: ["AC"] },
            { item: "POP-GNO-0020 6.3.2", prio: 7, ct: false, ctp: true, det: "Licenciamento no terminal CPBS", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
            { item: "POP-CCO-0234 6.2.3", prio: 6, ct: false, ctp: true, det: "Operações no Pátio do P1-07", risco: "Descumprimento de licença, quebra de chave, colisão de trens, descarrilamento", grupo: ["AC"] },
            { item: "POP-GNO-0020 6.3.3", prio: 6, ct: false, ctp: true, det: "Licenciamento no terminal Ternium", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
            { item: "POP-GNO-0020 6.3.4", prio: 6, ct: false, ctp: true, det: "Licenciamento no terminal Porto Sudeste", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
            { item: "POP-GNO-0020 6.3.5", prio: 6, ct: false, ctp: true, det: "Licenciamento no terminal Guaíba", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
            { item: "POP-CCO-0234 6.2.5", prio: 5, ct: false, ctp: true, det: "Licenciamento no terminal TAS", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
            { item: "POP-CCO-0234 6.2.4", prio: 5, ct: false, ctp: true, det: "Licenciamento no terminal TFI", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
            { item: "POP-CCO-0234 6.2.2", prio: 5, ct: false, ctp: true, det: "Licenciamento no terminal Viga", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
            { item: "POP-CCO-0234 6.2.1", prio: 5, ct: false, ctp: true, det: "Licenciamento no terminal Casa dePedra", risco: "Colisão de trens, quebra de chave", grupo: ["AC"] },
        ];

        function getPriorityColor(prio) {
            if (prio >= 10) return "bg-red-100 text-red-700 border-red-200";
            if (prio >= 8) return "bg-orange-100 text-orange-700 border-orange-200";
            if (prio === 7) return "bg-yellow-100 text-yellow-800 border-yellow-200";
            return "bg-emerald-100 text-emerald-700 border-emerald-200";
        }

        function getCheckmark(isTrue) {
            if (!isTrue) return '<span class="text-slate-300">-</span>';
            return `<svg class="w-5 h-5 mx-auto text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>`;
        }

        function getGroupBadge(grupos) {
            let badges = [];
            
            // Adiciona a tag AC se presente no array de grupos
            if (grupos.includes("AC")) {
                badges.push(`<span class="px-2 py-1 bg-purple-50 text-purple-600 rounded-md text-xs font-bold border border-purple-100">AC</span>`);
            }
            
            // Adiciona a tag MTM se presente no array de grupos
            if (grupos.includes("MTM")) {
                badges.push(`<span class="px-2 py-1 bg-indigo-50 text-indigo-600 rounded-md text-xs font-bold border border-indigo-100">MTM</span>`);
            }
            
            return `<div class="flex gap-1 justify-center">${badges.join('')}</div>`;
        }

        const tbody = document.getElementById("table-body");
        let htmlContent = "";

        tableData.forEach(row => {
            htmlContent += `
                <tr class="hover:bg-slate-50 transition-colors duration-150 group">
                    <td class="py-3 px-6 font-medium text-slate-800">${row.item}</td>
                    <td class="py-3 px-6 text-center">
                        <span class="inline-flex items-center justify-center px-2.5 py-1 text-xs font-bold rounded-full border ${getPriorityColor(row.prio)}">
                            ${row.prio}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-center">${getCheckmark(row.ct)}</td>
                    <td class="py-3 px-4 text-center">${getCheckmark(row.ctp)}</td>
                    <td class="py-3 px-6 leading-relaxed">${row.det}</td>
                    <td class="py-3 px-6 leading-relaxed text-slate-600 group-hover:text-slate-800">${row.risco}</td>
                    <td class="py-3 px-6 text-center">${getGroupBadge(row.grupo)}</td>
                </tr>
            `;
        });

        tbody.innerHTML = htmlContent;
    </script>
</body>
</html>
